#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M
kotlin.compiler.execution.strategy=in-process
# iOS: the shared iosMain code uses the C interop libraries of both iOS targets.
kotlin.mpp.enableCInteropCommonization=true

#Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.workers.max=2
org.gradle.parallel=false

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Morivia version for Android and iOS (single source of truth).
# Change it only with: python3 scripts/bump-version.py patch|minor|major
morivia.versionName=1.7.1
morivia.versionCode=17
