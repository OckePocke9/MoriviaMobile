#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M
kotlin.compiler.execution.strategy=in-process

# Share Apple C interop declarations between iOS device and simulator targets.
kotlin.mpp.enableCInteropCommonization=true

#Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.workers.max=2
org.gradle.parallel=false

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Morivia Android version (single source of truth).
# Change it only with: .\scripts\bump-version.ps1 (or python3 scripts/bump-version.py); it goes up by 0.1.
morivia.versionName=1.9
morivia.versionCode=199
