workflows:
  morivia-ios-sideload:
    name: Morivia iPhone and iPad (Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    inputs:
      app_version:
        description: Morivia app version from gradle.properties, for example 1.8
        type: string
      configuration:
        description: Use Debug for a quick device test or Release for an optimized IPA
        type: choice
        options: [Release, Debug]
        default: Release
    labels:
      - Morivia iOS ${{ inputs.app_version }}
    environment:
      vars:
        MORIVIA_EXPECTED_VERSION: ${{ inputs.app_version }}
        IOS_CONFIGURATION: ${{ inputs.configuration }}
      xcode: '27.1'
      java: '21'
    scripts:
      - name: Prepare iOS playback dependencies
        script: |
          : "${MORIVIA_EXPECTED_VERSION:?Enter the Morivia app version}"
          touch local.properties
          gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_home"
          cat >> "$gradle_home/gradle.properties" <<'GRADLE_SETTINGS'
          org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.native.jvmArgs=-Xmx8g
          org.gradle.workers.max=2
          GRADLE_SETTINGS
          bash scripts/prepare-ios-dependencies.sh
      - name: Build unsigned device IPA
        script: bash scripts/build-ios-ipa.sh "$MORIVIA_EXPECTED_VERSION"
    artifacts:
      - build/ios-ipa/*.ipa
