name: Morivia iPhone and iPad

# Builds an unsigned IPA for iPhone and iPad (install it with Sideloadly, AltStore or SideStore).
# It only runs when the owner starts it by hand (Actions, Morivia iPhone and iPad, Run workflow).
# The repository is public, so GitHub's macOS runners cost nothing.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Release for an optimized IPA, Debug for a quicker device test
        type: choice
        options: [Release, Debug]
        default: Release

permissions:
  contents: read

concurrency:
  group: morivia-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS IPA
    # GitHub has too few Apple silicon Macs; the Intel image starts sooner and builds the same arm64 app.
    runs-on: macos-15-intel
    # GitHub stops hosted jobs after 6 hours; the release link of the iOS framework is slow on 4 cores.
    timeout-minutes: 360
    env:
      IOS_CONFIGURATION: ${{ inputs.configuration }}
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      KOTLIN_DAEMON_JVMARGS: -Xmx2048M
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Use the newest Xcode on the runner
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "${xcode}/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache Kotlin/Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare runtime configuration
        env:
          CONFIG_BASE64: ${{ secrets.MORIVIA_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$CONFIG_BASE64" ]; then
            printf '%s' "$CONFIG_BASE64" | base64 --decode > local.properties
            sed -i '' -E '/^[[:space:]]*sdk\.dir[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi
      - name: Give Gradle and Kotlin/Native more memory
        # Linking the release framework needs more than the 4 GB the project's gradle.properties
        # gives Android builds. The user-level file overrides it on this 14 GB runner only.
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx9g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "kotlin.native.jvmArgs=-Xmx9g"
            echo "kotlin.daemon.jvmargs=-Xmx2g"
          } >> ~/.gradle/gradle.properties
      - name: Download MPVKit and the streaming engine
        run: ./scripts/prepare-ios-dependencies.sh
      - name: Build unsigned iOS IPA
        run: ./scripts/build-ios-ipa.sh
      - name: Describe the IPA
        run: |
          ipa="$(ls build/ios-ipa/*.ipa | head -n 1)"
          {
            echo "## $(basename "${ipa}")"
            echo
            echo "- Size: $(du -h "${ipa}" | cut -f1)"
            echo "- Devices: iPhone and iPad"
            echo "- Signing: unsigned (sign it when installing, for example with Sideloadly)"
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v7
        with:
          name: morivia-ios-${{ inputs.configuration }}
          path: build/ios-ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
